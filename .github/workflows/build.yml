name: Byg program

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'CHANGELOG.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency: build

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Byg RFIDlibra.exe
        shell: pwsh
        run: |
          dotnet build RFIDlibra.csproj -c Release -o out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem out/*.exe

      - name: Udgiv på GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Versionen står i RFIDlibra.csproj (<Version>). Samme version bygget igen erstatter filen i udgivelsen.
          $version = ([xml](Get-Content RFIDlibra.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = "v$version"
          Write-Host "Version $version"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag out/RFIDlibra.exe --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag out/RFIDlibra.exe --title "RFIDlibra $version" --notes "Se CHANGELOG.md" --latest --repo "${{ github.repository }}"
          }
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RFIDlibra
          path: out/RFIDlibra.exe
